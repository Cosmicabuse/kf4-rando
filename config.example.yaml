# Original ISO. Required.
input: "C:\\path\\to\\King's Field - The Ancient City (USA).iso"

# Randomized ISO, overwritten if it exists. Not needed with debug_data.
output: "C:\\path\\to\\KF4_RANDOMIZED.iso"

seed: 12345

# Spoiler log path. Blank means spoiler_<seed>.log next to the output.
spoiler: ""

# Only dumps item/map data to debug_data/ and stops. Debug purposes.
debug_data: false

# QoL patches from resources/qol.pnach (see CREDITS.md). Only one mode per
# category can be true, and a few need another one on (the analog Y-axis
# modes need full_analog_controls). -list_mods prints every mode.
mods:
  - turn_speed_1_5x: false
  - turn_speed_2x: false
  - turn_accel_3x: false
  - full_analog_controls: false
  - full_analog_y_axis_inverted: false
  - full_analog_y_axis_normal: false
  - full_analog_clamping: false

# Changes ini/0611.ini, the new game's starting state, by key name. Leave it
# empty to keep vanilla. better to edit via GUI
starting_config: {}
# starting_config:
#   gold: 100
#   magic: 10
#   magic_fire_1: 1

# Removes the 5 DUMMY*.OUT padding files, the ISO gets ~2.68GB smaller.
strip_dummy_files: true

# Moves empty barrels/crates/pots out of the maps, so any container you see
# has something in it. Could be bugged
remove_empty_containers: false

# Wands warp from anywhere, not only from a teleport pad.
wands_anywhere: true

# What goes into the shuffle.
randomize_ground_items: true
randomize_container_items: true
randomize_monster_drops: true
randomize_idol_of_sorrow: true

# Multiply the gold and experience monsters give. 1 is vanilla.
gold_multiplier: 1
exp_multiplier: 1

# Puts the four gold shops in the shuffle, so they can sell anything, key
# items included. Every gold shop also sells arrows, bolts and Widda's arrows
# whenever anything is randomized. Defaults to false.
randomize_shops: false

# Randomized pickups are all drawn as the same blue gem. Its colour, as
# "#rrggbb". Blank keeps it blue.
shared_item_model_color: ''

# Adds the item's slot number to the pickup popup, "Antidote (#4)". Same
# numbers as the spoiler log.
pickup_popup_show_item_index: false

# Makes sure every seed can be finished. Set it to false for no logic shuffle.
logic_fill: true

# Keeps every item where vanilla put it. Mods, starting_config and the
# paramdomizer still apply.
disable_randomizer: false

# L3+R3 menu: Toggle HUD (position, map ID, last item taken, items left in
# the map), Warp (any map), Levitate (stops you falling).
# Up/Down to move, X to confirm, Square to cancel.
full_debug_mode: false

# Rerolls weapon and armor stats. Item placement isn't affected.
enable_paramdomizer: false

# How far a stat total can move from vanilla, in percent. 25 if left at 0.
paramdomizer_percent: 25

# Lets weapon stats go negative. Never for armor, negative defence isn't
# safe yet.
paramdomizer_allow_negative: false

# Lets a weapon's level 2 or 3 be worse than the level before.
paramdomizer_allow_worse_levels: false
